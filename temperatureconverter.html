<!DOCTYPE html>
<html>
    <head>
        <title>CONVERT CELCIUS INTO FAHRENHEIT!</title>
    </head>
    <style>
        body{
            background-color:lightgreen;

        }
    </style>
    <body>
        <label>Enter your temperature in Celcius!</label>
        <input type="number" id="celcius" placeholder="eg. 32">
        <button onclick="convertTemp()"> Convert! </button>

        <h3 id="result">Result</h3>
        <style>
            h3{
                color:red;
            }
        </style>
        <script>
            function  convertTemp(){
            //Grab the number typed into the "celcius" input box
            c = document.getElementById("celcius").value;
            
            //Calculate F=(c*9/5)+32
            f = (c*9/5)+32;

            //Show the answer on the screen
            document.getElementById("result").innerText = f+ "°F";
            }
        </script>
    </body>
</html>
